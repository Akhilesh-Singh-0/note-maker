<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note-Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="noteMaker">
            <h1><i>Note-Maker 📑</i></h1>
    
            <input id="noteTitle" type="text" placeholder="Title of note">
            

        
            <textarea id="noteContent" placeholder="Start writing here...."></textarea>
            

        
            <button id="saveBtn">Save</button>
        </div>     
    </div>

    <ol id="saveNote"></ol>
    
    <script src="script.js"></script>
</body>
</html>
